name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 无依赖安装步骤：项目刻意保持零运行时依赖
      - name: Static checks (manifest, version sync, syntax)
        run: npm run check

      - name: Behavior regressions
        run: npm test
