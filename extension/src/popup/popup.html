<!--
  [INPUT]: 依赖 popup.css 与 popup-ai.css 的 macOS 设置面板样式及 popup.js 的模式、provider、翻译参数和日志交互
  [OUTPUT]: 提供四个设置页签、直达报文面板的侧栏操作与独立工作区
  [POS]: popup 模块的 DOM 壳；翻译提示词和前瞻参数位于 provider 表单之外，由 manifest action.default_popup 加载
  [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>双字幕 · Netflix</title>
    <link rel="stylesheet" href="./popup.css">
    <link rel="stylesheet" href="./popup-ai.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="app-sidebar">
        <header class="app-header">
          <div class="brand">
            <img class="brand-mark" src="../../icons/icon-48.png" width="32" height="32" alt="">
            <h1>双字幕</h1>
          </div>
        </header>

        <nav class="tab-list" aria-label="设置分类" role="tablist" aria-orientation="vertical">
          <button class="tab-button is-active" id="subtitlesTab" type="button" role="tab" aria-selected="true" aria-controls="subtitlesPanel" data-tab="subtitles">字幕</button>
          <button class="tab-button" id="aiTab" type="button" role="tab" tabindex="-1" aria-selected="false" aria-controls="aiPanel" data-tab="ai">AI 翻译</button>
          <button class="tab-button" id="providerTab" type="button" role="tab" tabindex="-1" aria-selected="false" aria-controls="providerPanel" data-tab="provider">翻译服务</button>
          <button class="tab-button" id="stylesTab" type="button" role="tab" tabindex="-1" aria-selected="false" aria-controls="stylesPanel" data-tab="styles">外观</button>
        </nav>
        <div class="sidebar-tools">
          <button class="sidebar-action" id="openRawDiagnostics" type="button" aria-label="打开诊断报文面板">诊断 <span aria-hidden="true">↗</span></button>
        </div>
      </aside>

      <div class="workspace">
        <header class="workspace-header">
          <div class="workspace-heading">
            <h2 id="activePageTitle">字幕</h2>
            <div class="page-status" role="status" aria-live="polite">
              <span id="statusDot" class="status-dot" data-state="loading"></span>
              <span id="pageStatus">正在连接 Netflix</span>
            </div>
          </div>
        </header>

      <section id="subtitlesPanel" class="tab-panel" role="tabpanel" aria-labelledby="subtitlesTab" data-panel="subtitles">
        <div class="settings-list">
          <label class="setting-row" for="enabled">
            <span><strong>启用字幕</strong><small>在 Netflix 播放页面显示双字幕</small></span>
            <span class="toggle">
              <input id="enabled" type="checkbox" aria-label="启用字幕覆盖">
              <span class="toggle-track" aria-hidden="true"></span>
            </span>
          </label>
        </div>
        <section class="source-section" aria-labelledby="sourceTitle">
        <div class="section-heading">
          <div>
            <h2 id="sourceTitle">字幕来源</h2>
          </div>
          <div class="action-group">
            <button id="swapTracks" class="icon-button" type="button" title="交换两行字幕及样式" aria-label="交换两行字幕及样式"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 6h13m-3-3 3 3-3 3M17 14H4m3-3-3 3 3 3"/></svg></button>
            <button id="reloadTracks" class="icon-button" type="button" title="重新读取字幕" aria-label="重新读取字幕"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16.5 8A6.5 6.5 0 1 0 17 11m-.5-7v4h-4"/></svg></button>
          </div>
        </div>

        <div class="subtitle-mode" role="group" aria-label="字幕模式">
          <button id="nativeMode" type="button" aria-pressed="true">双原生字幕</button>
          <button id="aiMode" type="button" aria-pressed="false">AI 翻译字幕</button>
        </div>
        <div class="mode-help">
          <p id="modeDescription" class="ai-consent">两行分别显示 Netflix 原生字幕。</p>
          <button id="openAiSettings" class="inline-link" type="button" hidden>配置翻译</button>
        </div>
        <div id="trackGrid" class="track-grid" aria-label="字幕轨道">
          <article class="track-card">
            <label class="field" for="primaryTrackKey">
              <span id="primaryTrackLabel" class="field-label">第一行字幕来源</span>
              <select id="primaryTrackKey"></select>
            </label>
            <p id="primaryStatus" class="track-status" data-state="idle">未选择</p>
          </article>

          <article class="track-card">
            <label class="field" for="secondaryTrackKey">
              <span id="secondaryTrackLabel" class="field-label">第二行字幕来源</span>
              <select id="secondaryTrackKey"></select>
            </label>
            <p id="secondaryStatus" class="track-status" data-state="idle">未选择</p>
          </article>
        </div>
        </section>

        <section class="playback-section" aria-labelledby="playbackTitle">
        <h2 id="playbackTitle">播放显示</h2>
        <div class="settings-list">
          <label class="setting-row" for="hideNativeSubtitles">
            <span>
              <strong>隐藏原生字幕</strong>
              <small>使用插件字幕替代 Netflix 字幕</small>
            </span>
            <span class="toggle">
              <input id="hideNativeSubtitles" type="checkbox">
              <span class="toggle-track" aria-hidden="true"></span>
            </span>
          </label>

          <label class="setting-row" for="timingOffsetMs">
            <span>
              <strong>时间偏移</strong>
              <small>正值延后，负值提前</small>
            </span>
            <span class="number-control">
              <input id="timingOffsetMs" type="number" step="100" aria-label="字幕时间偏移">
              <span>ms</span>
            </span>
          </label>
        </div>
        </section>
      </section>
      <section id="aiPanel" class="tab-panel ai-panel" role="tabpanel" aria-labelledby="aiTab" data-panel="ai" hidden>
        <section class="ai-section" aria-labelledby="aiSettingsTitle">
          <h2 id="aiSettingsTitle">翻译设置</h2>
          <div class="ai-fields">
            <label class="field" for="aiSourceLanguage">
              <span class="field-label">AI 源字幕轨道</span>
              <select id="aiSourceLanguage"></select>
            </label>
            <label class="field" for="aiTargetLanguage">
              <span class="field-label">目标语言</span>
              <select id="aiTargetLanguage">
                <option value="zh-Hans">简体中文</option>
                <option value="zh-Hant">繁體中文</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="pt-BR">Português (Brasil)</option>
                <option value="ru">Русский</option>
                <option value="ar">العربية</option>
                <option value="hi">हिन्दी</option>
              </select>
            </label>
          </div>
          <details class="advanced-translation">
            <summary>高级翻译设置 <span>预翻译、上下文、提示词</span></summary>
            <div class="advanced-translation-content">
              <div class="ai-fields">
                <label class="field prefetch-field" for="aiPrefetchCount">
                  <span class="field-label">预翻译字幕句组</span>
                  <input id="aiPrefetchCount" type="number" min="0" max="50" step="1" value="10" inputmode="numeric">
                </label>
                <label class="field prefetch-field" for="aiContextCount">
                  <span class="field-label">前后文各取字幕条数</span>
                  <input id="aiContextCount" type="number" min="0" max="4" step="1" value="2" inputmode="numeric">
                </label>
              </div>
              <p class="ai-consent">预翻译默认最多 10 组、限播放前方 60 秒（倍速最长 120 秒）；0 只翻译当前句。前后文默认每侧 2 条，只用于理解语境。</p>
              <label class="field" for="aiStyleGuide">
                <span class="field-label">翻译提示词（全局，不属于翻译服务）</span>
                <textarea id="aiStyleGuide" rows="3" maxlength="1000" placeholder="保持原意和人物语气，使用自然口语。"></textarea>
              </label>
            </div>
          </details>
          <button id="openProviderSettings" class="inline-link section-link" type="button">配置翻译服务 →</button>
        </section>
      </section>

      <section id="providerPanel" class="tab-panel ai-panel" role="tabpanel" aria-labelledby="providerTab" data-panel="provider" hidden>
        <section class="ai-section" aria-labelledby="providerTitle">
          <h2 id="providerTitle">翻译服务</h2>
          <div class="field">
            <label class="field-label" id="providerLabel" for="aiProvider">当前服务</label>
            <div class="provider-switcher">
              <select id="aiProvider" aria-labelledby="providerLabel"></select>
              <button id="addProvider" class="ai-button" type="button" title="新增服务" aria-label="新增服务"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></button>
              <button id="deleteProvider" class="ai-button ai-button-quiet" type="button" title="删除服务" aria-label="删除服务"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h12"/></svg></button>
            </div>
          </div>
          <div id="providerEditor" class="provider-editor" hidden>
            <label class="field" for="providerName">
              <span class="field-label">服务名称</span>
              <input id="providerName" type="text" maxlength="48" autocomplete="off" placeholder="如 深度求索" spellcheck="false">
            </label>
            <div class="field">
              <label class="field-label" for="providerModel">模型 ID</label>
              <div class="provider-model-row">
                <input id="providerModel" list="providerModelList" type="text" maxlength="120" autocomplete="off" placeholder="gpt-4o-mini" spellcheck="false">
                <button id="fetchProviderModels" class="ai-button" type="button">获取模型</button>
              </div>
              <datalist id="providerModelList"></datalist>
            </div>
            <label class="field" for="providerEndpoint">
              <span class="field-label">兼容接口地址（留空使用 OpenAI）</span>
              <input id="providerEndpoint" type="url" maxlength="2048" autocomplete="url" spellcheck="false" placeholder="https://provider.example/v1/chat/completions">
            </label>
          </div>
          <p id="aiEndpointStatus" class="ai-consent" role="status" aria-live="polite">使用其他服务时，需要授权其域名；字幕文本与密钥会发送给该服务。</p>
          <div class="ai-credential">
            <label class="field" for="aiCredential">
              <span class="field-label">当前服务的 API 密钥</span>
              <input id="aiCredential" type="password" autocomplete="off" spellcheck="false" placeholder="输入新密钥后保存">
            </label>
            <div class="ai-credential-actions">
              <span id="aiCredentialStatus" class="ai-credential-status" role="status" aria-live="polite">正在检查密钥</span>
              <button id="saveAiCredential" class="ai-button" type="button">保存密钥</button>
              <button id="deleteAiCredential" class="ai-button ai-button-quiet" type="button">删除密钥</button>
            </div>
          </div>
          <p class="ai-consent">启用 AI 后，源轨道字幕及邻句会发送给所选服务；使用自己的 API 密钥可能产生费用。</p>
          <div class="provider-test-row">
            <button id="testProvider" class="ai-button" type="button">测试连通性</button>
            <span id="providerTestStatus" class="ai-credential-status" role="status" aria-live="polite"></span>
          </div>
        </section>
      </section>

      <section id="stylesPanel" class="tab-panel styles-panel" role="tabpanel" aria-labelledby="stylesTab" data-panel="styles" hidden>
        <div class="style-stage">
          <div class="style-toolbar">
            <div class="role-selector" role="group" aria-label="正在编辑的字幕">
              <button class="is-active" type="button" data-style-role="primary" aria-pressed="true"><span class="role-swatch primary"></span>第一字幕</button>
              <button type="button" data-style-role="secondary" aria-pressed="false"><span class="role-swatch secondary"></span>第二字幕</button>
            </div>
            <button id="resetStyles" class="icon-button" type="button" title="恢复默认样式" aria-label="恢复默认样式"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 8A6.5 6.5 0 1 1 3 11m1-7v4h4"/></svg></button>
          </div>

          <div id="stylePreview" class="preview" aria-hidden="true" data-layout="balanced">
            <span class="preview-label">屏幕预览</span>
            <div id="primaryPreview" class="preview-line primary is-editing">第一字幕</div>
            <div id="secondaryPreview" class="preview-line secondary">Second subtitle</div>
          </div>
        </div>

        <div class="style-settings-scroll">
          <section class="style-section" aria-labelledby="layoutTitle">
            <h2 id="layoutTitle">位置与尺寸</h2>
            <div class="preset-list" role="group" aria-label="双字幕位置预设">
              <button type="button" data-layout-preset="compact">紧凑</button>
              <button type="button" data-layout-preset="balanced">标准</button>
              <button type="button" data-layout-preset="spacious">舒展</button>
              <button type="button" data-layout-preset="free">自由</button>
            </div>
            <div class="control-grid">
              <label class="range-field" for="styleFontSize">
                <span class="range-heading">
                  <span>字号</span>
                  <output id="styleFontSizeValue" for="styleFontSize">26 px</output>
                </span>
                <input id="styleFontSize" type="range" min="18" max="44" step="1">
              </label>

              <label class="range-field" for="styleVerticalOffset">
                <span class="range-heading">
                  <span>自由位置</span>
                  <output id="styleVerticalOffsetValue" for="styleVerticalOffset">26%</output>
                </span>
                <input id="styleVerticalOffset" type="range" min="8" max="42" step="1">
              </label>
            </div>
          </section>

          <section class="style-section" aria-labelledby="textStyleTitle">
            <h2 id="textStyleTitle">文字</h2>
            <div class="control-grid">
              <label class="compact-field" for="styleFontFamily">
                <span>字体</span>
                <select id="styleFontFamily">
                  <option value="system">系统</option>
                  <option value="sans">无衬线</option>
                  <option value="serif">衬线</option>
                  <option value="rounded">圆体</option>
                </select>
              </label>

              <label class="compact-field" for="styleFontWeight">
                <span>字重</span>
                <select id="styleFontWeight">
                  <option value="500">中等</option>
                  <option value="600">半粗</option>
                  <option value="700">粗体</option>
                  <option value="800">特粗</option>
                </select>
              </label>

              <label class="range-field" for="styleLineHeight">
                <span class="range-heading">
                  <span>行高</span>
                  <output id="styleLineHeightValue" for="styleLineHeight">1.28</output>
                </span>
                <input id="styleLineHeight" type="range" min="1" max="1.6" step="0.05">
              </label>

              <label class="range-field" for="styleMaxWidth">
                <span class="range-heading">
                  <span>最大宽度</span>
                  <output id="styleMaxWidthValue" for="styleMaxWidth">86%</output>
                </span>
                <input id="styleMaxWidth" type="range" min="55" max="96" step="1">
              </label>

              <label class="compact-field" for="styleTextColor">
                <span>文字颜色</span>
                <span class="color-control">
                  <input id="styleTextColor" type="color" value="#ffffff">
                  <output id="styleTextColorValue" for="styleTextColor">#FFFFFF</output>
                </span>
              </label>

              <label class="range-field" for="styleTextOpacity">
                <span class="range-heading">
                  <span>文字透明度</span>
                  <output id="styleTextOpacityValue" for="styleTextOpacity">100%</output>
                </span>
                <input id="styleTextOpacity" type="range" min="40" max="100" step="5">
              </label>
            </div>
          </section>

          <section class="style-section" aria-labelledby="effectsStyleTitle">
            <h2 id="effectsStyleTitle">描边与背景</h2>
            <div class="control-grid">
              <label class="compact-field" for="styleStrokeColor">
                <span>描边颜色</span>
                <span class="color-control">
                  <input id="styleStrokeColor" type="color" value="#000000">
                  <output id="styleStrokeColorValue" for="styleStrokeColor">#000000</output>
                </span>
              </label>

              <label class="range-field" for="styleStrokeWidth">
                <span class="range-heading">
                  <span>描边宽度</span>
                  <output id="styleStrokeWidthValue" for="styleStrokeWidth">1 px</output>
                </span>
                <input id="styleStrokeWidth" type="range" min="0" max="4" step="0.5">
              </label>

              <label class="compact-field" for="styleBackgroundColor">
                <span>背景颜色</span>
                <span class="color-control">
                  <input id="styleBackgroundColor" type="color" value="#000000">
                  <output id="styleBackgroundColorValue" for="styleBackgroundColor">#000000</output>
                </span>
              </label>

              <label class="range-field" for="styleBackgroundOpacity">
                <span class="range-heading">
                  <span>背景透明度</span>
                  <output id="styleBackgroundOpacityValue" for="styleBackgroundOpacity">64%</output>
                </span>
                <input id="styleBackgroundOpacity" type="range" min="0" max="90" step="5">
              </label>
            </div>
          </section>
        </div>
      </section>
      </div>
    </main>
    <script src="./popup.js"></script>
  </body>
</html>
